name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Paquets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: kalo-windows
          - os: ubuntu-latest
            artifact: kalo-linux
          - os: macos-latest
            artifact: kalo-macos
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Construire les paquets
        if: runner.os != 'Windows'
        run: npm run tauri -w @kalo/desktop -- build
      - name: Construire l'installateur Windows (DirectML et runtime VC++ inclus)
        if: runner.os == 'Windows'
        run: npm run bundle:windows
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/**
          if-no-files-found: error

  publish:
    name: Brouillon de release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets
      - name: Créer le brouillon avec les installateurs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find paquets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | xargs -0 gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --repo "$GITHUB_REPOSITORY"
