[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/kalo-core",
  "crates/kalo-database",
  "crates/kalo-downloads",
  "crates/kalo-library",
  "crates/kalo-stems",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kalo-app/kalo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
lofty = "0.25"
walkdir = "2"
blake3 = "1"
dunce = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
